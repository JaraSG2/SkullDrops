name: Build SkullDrops
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build plugin
        run: gradle build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SkullDrops-JAR
          path: build/libs/*.jar
