
name: Build SkullDrops

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build plugin
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SkullDrops-JAR
          path: build/libs/*.jar
