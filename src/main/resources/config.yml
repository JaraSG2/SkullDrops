# Minecraft-Heads API v2: public app UUID only, no private API key needed
# for the basic access mode (subject to provider limits and availability).
# If the API has no exact matching texture, no custom mob head drops.
minecraft-heads:
  enabled: true
  app-uuid: "ee5fedf9-29de-49c4-9b0e-8d5527648829"
  demo: false # Development only: limited test data; do not enable for normal servers
  start-page: 1
  max-pages: 10 # legacy setting; startup synchronization processes one page
  page-delay-ms: 10000 # delay for future multi-page startup synchronization
  category-id: 0


# Targeted sync scans API pages only until configured mob textures are found.
# Existing matches are stored in minecraft-heads-cache.yml and survive restarts.
# Startup/reload requests one page, resuming from sync.next-page on next reload.
# A fully scanned API does not guarantee every mob variant exists.
